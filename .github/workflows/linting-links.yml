name: Linting (Links)

# Checks external links (https://...) in the Markdown docs with lychee, configured in lychee.toml.
# Links between files in this repository are checked by `yarn docs:lint` (Linting (Docs)), which runs offline.
#
# External websites can be slow, rate limit us or be down for a moment, so this check does not block merging:
# * On pull requests it only checks the Markdown files changed in the pull request, so you only see your own links.
#   Do not make this check required in the branch protection rules.
# * Every night it checks all docs on main, and opens (or updates) one issue labelled `dead-links` when links are dead.

on:
  pull_request:
    paths:
      - '**.md'
      - 'lychee.toml'
      - '.github/workflows/linting-links.yml'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Select files to check
        id: files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --diff-filter=AMR "origin/$BASE_REF...HEAD" -- '*.md' > lychee-files.txt
          else
            printf 'projects\nREADME.md\n' > lychee-files.txt
          fi
          cat lychee-files.txt
          if [ -s lychee-files.txt ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check links
        id: lychee
        if: steps.files.outputs.any == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }} --no-progress --files-from lychee-files.txt
          output: lychee-report.md
          fail: ${{ github.event_name == 'pull_request' }}
          jobSummary: true

      - name: Open, update or close the dead links issue
        if: github.event_name != 'pull_request' && steps.lychee.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --label dead-links --state open --json number --jq '.[0].number')
          if [ "$EXIT_CODE" != "0" ]; then
            printf '\n\nFound by [this run](%s). Fix the links in the docs; this issue is updated every night.\n' "$RUN_URL" >> lychee-report.md
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file lychee-report.md
            else
              gh label create dead-links --color B60205 --description "Dead links found by the nightly link check" --force
              gh issue create --title "Dead links in the docs" --label dead-links --body-file lychee-report.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "All links work again according to [this run]($RUN_URL)."
          fi
